<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Power-up artwork review</title><style>body{background:#f5f1e8;color:#2e4641;font:16px Arial;margin:24px}h1{font:30px Georgia}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;max-width:740px}article{background:#fffaf0;border:1px solid #ccd3c4;border-radius:12px;text-align:center;padding:14px}canvas{display:block;margin:auto;width:90px;height:85px;background:#bce9e5;border-radius:8px}p{font-size:13px;line-height:1.5}small{display:block;color:#52665c}</style><h1>Know your power-ups</h1><p>Actual game artwork at its normal drawing size.</p><main></main><script src="../src/core.js"></script><script src="../src/render.js"></script><script>for(const [kind,info]of Object.entries(CatArt.POWERUPS)){const card=document.createElement('article'),canvas=document.createElement('canvas');canvas.width=180;canvas.height=170;const r=new CatArt.Renderer(canvas);r.c.scale(2,2);r.motion=false;r.item({kind,x:45,y:30},0);const name=document.createElement('h2');name.textContent=info.name;name.style.fontSize='16px';const hint=document.createElement('p');hint.textContent=info.hint;card.append(canvas,name,hint);document.querySelector('main').append(card)}</script></html>
